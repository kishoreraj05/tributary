[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tributary-backend"
version = "0.1.0"
description = "API for Tributary: pipelines, connections, previews and runs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
  "tributary-engine",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tributary-backend = "tributary_backend.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tributary_backend = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
